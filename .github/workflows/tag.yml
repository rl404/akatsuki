name: Tag

on: workflow_dispatch

permissions:
  contents: write

concurrency:
  group: tag
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: tag_version
        uses: mathieudutour/github-tag-action@v7
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          dry_run: true
      - uses: jacobtomlinson/gha-find-replace@v3
        with:
          find: "Akatsuki/${{ steps.tag_version.outputs.previous_version }} (github.com/rl404/akatsuki)"
          replace: "Akatsuki/${{ steps.tag_version.outputs.new_version }} (github.com/rl404/akatsuki)"
          include: "internal/domain/mal/repository/client/client.go"
          regex: false
      - id: push_changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          file_pattern: "internal/domain/mal/repository/client/client.go"
      - name: Create tag
        uses: mathieudutour/github-tag-action@v7
        with:
          github_token: ${{ secrets.CR_PAT }}
          commit_sha: ${{ steps.push_changes.outputs.commit_hash }}
          custom_tag: ${{ steps.tag_version.outputs.new_version }}
